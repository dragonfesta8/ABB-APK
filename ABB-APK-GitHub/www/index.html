<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB IPTV</title>

<style>
:root {
  --bg: #0b0913;
  --panel: #15111f;
  --panel-light: #211a30;
  --panel-hover: #302442;
  --purple: #a875ff;
  --purple-light: #c7a6ff;
  --mint: #8ff0c4;
  --white: #ffffff;
  --muted: #aaa2b8;
  --border: rgba(199,166,255,.13);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
}

header {
  height: 76px;
  padding: 0 34px;
  background: rgba(15,12,23,.96);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--purple-light);
}

#page-title {
  color: var(--muted);
  font-size: 15px;
}

main {
  padding: 30px 38px 45px;
  max-width: 1600px;
  margin: auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
  animation: aparecer .25s ease;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tela inicial */

.home-title {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 8px;
}

.home-subtitle {
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 26px;
}

.hero {
  min-height: 290px;
  padding: 38px;
  margin-bottom: 35px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background:
    radial-gradient(circle at 80% 20%, rgba(168,117,255,.35), transparent 35%),
    linear-gradient(110deg, #21152f 0%, #171124 55%, #302044 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.hero-label {
  color: var(--mint);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 14px;
}

.hero h1 {
  max-width: 550px;
  font-size: clamp(30px, 5vw, 48px);
  line-height: 1.08;
  margin: 0 0 14px;
}

.hero p {
  color: #c4bbd2;
  max-width: 480px;
  line-height: 1.6;
  margin: 0 0 23px;
}

.hero button {
  width: fit-content;
  min-width: 190px;
  background: var(--purple);
  color: #160e22;
  border: none;
}

.section-heading {
  font-size: 21px;
  font-weight: bold;
  margin: 0 0 17px;
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

button {
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 19px;
  background: var(--panel-light);
  color: var(--white);
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  text-align: left;
  transition: transform .18s, background .18s, border-color .18s;
}

button:focus {
  outline: none;
  border: 2px solid var(--mint);
  background: var(--panel-hover);
  transform: scale(1.035);
  box-shadow: 0 0 22px rgba(143,240,196,.13);
}

.menu button {
  min-height: 125px;
  font-size: 19px;
  color: var(--purple-light);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.menu button::after {
  content: "Explorar  →";
  color: var(--muted);
  font-size: 13px;
  font-weight: normal;
}

/* Categorias e canais */

.panel-title {
  font-size: 25px;
  font-weight: 800;
  color: var(--white);
  margin: 5px 0 23px;
}

#channels {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 15px;
}

.channel-button {
  min-height: 82px;
  font-size: 15px;
  line-height: 1.35;
  background: linear-gradient(145deg, #211a30, #171321);
  border-radius: 14px;
  overflow-wrap: anywhere;
}

#channels button:first-child {
  color: var(--mint);
}

#status {
  color: var(--muted);
  margin-top: 24px;
  font-size: 14px;
}

/* Player */

#player-screen {
  max-width: 1100px;
  margin: auto;
}

#player-title {
  font-size: 24px;
  color: var(--purple-light);
}

#player-message {
  margin: 15px 0;
  color: var(--mint);
}

#video {
  width: 100%;
  max-height: 70vh;
  background: #000;
  border: 1px solid var(--border);
  border-radius: 16px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 22px 0;
}

.actions button {
  min-width: 140px;
}

/* Telas menores */

@media (max-width: 700px) {
  header {
    height: 65px;
    padding: 0 18px;
  }

  .logo {
    font-size: 22px;
  }

  main {
    padding: 22px 17px 35px;
  }

  .hero {
    min-height: 250px;
    padding: 25px;
  }

  .menu {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .menu button {
    min-height: 90px;
  }

  #channels {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .channel-button {
    min-height: 75px;
    padding: 13px;
    font-size: 13px;
  }
}

@media (min-width: 1100px) {
  main {
    padding-top: 38px;
  }

  #channels {
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ABB IPTV</div>
  <div id="page-title">Início</div>
</header>

<main>

<section id="home" class="screen active">

  <div class="home-title">Bem-vindo ao ABB</div>
  <div class="home-subtitle">Seu entretenimento em um só lugar.</div>

  <div class="hero">
    <div class="hero-label">ABB IPTV ORIGINAL</div>
    <h1>Seu mundo de entretenimento.</h1>
    <p>
      Acesse seus canais ao vivo e aproveite sua programação
      em uma experiência simples e moderna.
    </p>
    <button id="tv-button">▶ ASSISTIR AGORA</button>
  </div>

  <div class="section-heading">Explore o ABB</div>

  <div class="menu">
    <button onclick="abrirTV()">📺 TV AO VIVO</button>

    <button onclick="mostrarMensagem('Filmes em desenvolvimento')">
      🎬 FILMES
    </button>

    <button onclick="mostrarMensagem('Séries em desenvolvimento')">
      📁 SÉRIES
    </button>
  </div>

</section>

<section id="tv-screen" class="screen">
  <div class="panel-title">CANAIS</div>
  <div id="channels"></div>
  <div id="status">Carregando...</div>
</section>

<section id="player-screen" class="screen">
  <div class="panel-title" id="player-title">REPRODUTOR</div>
  <div id="player-message">Carregando canal...</div>
  <video id="video" controls autoplay playsinline></video>

  <div class="actions">
    <button onclick="fecharPlayer()">⬅ Voltar</button>
  </div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const home = document.getElementById('home');
const tvScreen = document.getElementById('tv-screen');
const playerScreen = document.getElementById('player-screen');
const channels = document.getElementById('channels');
const pageTitle = document.getElementById('page-title');
const status = document.getElementById('status');
const video = document.getElementById('video');
const playerMessage = document.getElementById('player-message');
const panelTitle = document.querySelector('.panel-title');

const arquivos = [
  'CanaisBR01.m3u8',
  'CanaisBR02.m3u8'
];

const TAMANHO_PAGINA = 50;

let listaCanais = [];
let categorias = [];
let categoriaAtual = '';
let paginaAtual = 0;
let telaAtual = 'home';

async function carregarListas() {
  listaCanais = [];

  for (const arquivo of arquivos) {
    try {
      const resposta = await fetch('./' + arquivo);

      if (!resposta.ok) {
        throw new Error('Não foi possível abrir ' + arquivo);
      }

      const texto = await resposta.text();
      const linhas = texto.split(/\r?\n/);

      let dados = null;

      for (const linhaOriginal of linhas) {
        const linha = linhaOriginal.trim();

        if (linha.startsWith('#EXTINF:')) {
          const nome = linha.includes(',')
            ? linha.substring(linha.lastIndexOf(',') + 1).trim()
            : 'Canal sem nome';

          const grupo = linha.match(/group-title="([^"]*)"/i);

          dados = {
            nome: nome || 'Canal sem nome',
            categoria: grupo && grupo[1]
              ? grupo[1].trim()
              : 'Outros'
          };
        } else if (
          dados &&
          linha &&
          !linha.startsWith('#')
        ) {
          listaCanais.push({
            nome: dados.nome,
            categoria: dados.categoria,
            url: linha
          });

          dados = null;
        }
      }
    } catch (erro) {
      console.error(erro);
    }
  }

  categorias = [...new Set(
    listaCanais.map(canal => canal.categoria)
  )].sort((a, b) => a.localeCompare(b));

  return listaCanais.length;
}

async function abrirTV() {
  home.classList.remove('active');
  playerScreen.classList.remove('active');
  tvScreen.classList.add('active');

  telaAtual = 'categorias';
  pageTitle.textContent = 'TV ao vivo';
  panelTitle.textContent = 'CATEGORIAS';
  status.textContent = 'Carregando listas de canais...';

  channels.innerHTML = '';

  const total = await carregarListas();

  if (total === 0) {
    status.textContent =
      'Nenhum canal encontrado. Verifique os arquivos M3U8.';
    return;
  }

  status.textContent = total + ' canais carregados';

  mostrarCategorias();
}

function mostrarCategorias() {
  telaAtual = 'categorias';
  panelTitle.textContent = 'CATEGORIAS';
  pageTitle.textContent = 'Categorias';

  channels.innerHTML = '';

  categorias.forEach(categoria => {
    const botao = document.createElement('button');
    botao.textContent = '📁 ' + categoria;
    botao.className = 'channel-button';

    botao.onclick = () => {
      categoriaAtual = categoria;
      paginaAtual = 0;
      carregarPagina();
    };

    channels.appendChild(botao);
  });

  status.textContent = categorias.length + ' categorias';

  const primeiro = channels.querySelector('button');
  if (primeiro) primeiro.focus();
}

function carregarPagina() {
  telaAtual = 'canais';
  panelTitle.textContent = categoriaAtual;
  pageTitle.textContent = categoriaAtual;

  channels.innerHTML = '';

  const encontrados = listaCanais.filter(
    canal => canal.categoria === categoriaAtual
  );

  const inicio = paginaAtual * TAMANHO_PAGINA;
  const pagina = encontrados.slice(
    inicio,
    inicio + TAMANHO_PAGINA
  );

  const voltar = document.createElement('button');
  voltar.textContent = '⬅ Voltar às categorias';
  voltar.onclick = mostrarCategorias;
  channels.appendChild(voltar);

  pagina.forEach(canal => {
    const botao = document.createElement('button');
    botao.textContent = '📺 ' + canal.nome;
    botao.className = 'channel-button';

    botao.onclick = () => abrirPlayer(canal);

    channels.appendChild(botao);
  });

  const totalPaginas = Math.ceil(
    encontrados.length / TAMANHO_PAGINA
  );

  if (paginaAtual > 0) {
    const anterior = document.createElement('button');
    anterior.textContent = '⬅ Página anterior';
    anterior.onclick = () => {
      paginaAtual--;
      carregarPagina();
    };
    channels.appendChild(anterior);
  }

  if (paginaAtual + 1 < totalPaginas) {
    const proxima = document.createElement('button');
    proxima.textContent = 'Próxima página ➡';
    proxima.onclick = () => {
      paginaAtual++;
      carregarPagina();
    };
    channels.appendChild(proxima);
  }

  status.textContent =
    encontrados.length + ' canais | Página ' +
    (paginaAtual + 1) + ' de ' + totalPaginas;

  const primeiroCanal = channels.querySelectorAll('button')[1];
  if (primeiroCanal) primeiroCanal.focus();
}

let hls = null;

function abrirPlayer(canal) {
  tvScreen.classList.remove('active');
  playerScreen.classList.add('active');

  telaAtual = 'player';
  pageTitle.textContent = canal.nome;

  document.getElementById('player-title').textContent =
    canal.nome;

  playerMessage.textContent = 'Abrindo canal...';

  if (window.AbbPlayer && window.AbbPlayer.play) {
    window.AbbPlayer.play(canal.url, canal.nome);
    playerMessage.textContent = 'Reprodutor Android iniciado.';
  } else {
    playerMessage.textContent =
      'Reprodutor nativo indisponível nesta versão.';
  }
}
function fecharPlayer() {
  video.pause();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.removeAttribute('src');
  video.load();

  playerScreen.classList.remove('active');
  tvScreen.classList.add('active');

  carregarPagina();
}
  
function voltarInicio() {
  video.pause();
  video.removeAttribute('src');
  video.load();

  tvScreen.classList.remove('active');
  playerScreen.classList.remove('active');
  home.classList.add('active');

  telaAtual = 'home';
  pageTitle.textContent = 'Início';

  document.getElementById('tv-button').focus();
}

function mostrarMensagem(mensagem) {
  alert(mensagem);
}

document.getElementById('tv-button')
  .addEventListener('click', abrirTV);

document.addEventListener('keydown', function(event) {
  if (
    event.key === 'Escape' ||
    event.key === 'Backspace' ||
    event.key === 'BrowserBack' ||
    event.key === 'GoBack'
  ) {
    event.preventDefault();

    if (playerScreen.classList.contains('active')) {
      fecharPlayer();
    } else if (tvScreen.classList.contains('active')) {
      if (telaAtual === 'canais') {
        mostrarCategorias();
      } else {
        voltarInicio();
      }
    }
  }
});

document.getElementById('tv-button').focus();
</script>

</body>
</html>
