
<script>
const home = document.getElementById('home');
const tvScreen = document.getElementById('tv-screen');
const playerScreen = document.getElementById('player-screen');
const channels = document.getElementById('channels');
const pageTitle = document.getElementById('page-title');
const status = document.getElementById('status');
const video = document.getElementById('video');
const playerMessage = document.getElementById('player-message');
const panelTitle = document.querySelector('.panel-title');

const arquivos = [
  'CanaisBR01.m3u8',
  'CanaisBR02.m3u8'
];

const TAMANHO_PAGINA = 50;

let categorias = [];
let categoriaAtual = '';
let paginaAtual = 0;
let telaAtual = 'inicio';
let categoriasCarregadas = false;

/* LEITURA DA PLAYLIST EM BLOCOS */
async function lerLinhas(arquivo, callback) {
  const resposta = await fetch(arquivo);

  if (!resposta.ok) {
    throw new Error('Não foi possível abrir ' + arquivo);
  }

  if (!resposta.body) {
    const texto = await resposta.text();
    texto.split(/\r?\n/).forEach(callback);
    return;
  }

  const leitor = resposta.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await leitor.read();

    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    const linhas = buffer.split(/\r?\n/);
    buffer = linhas.pop();

    linhas.forEach(callback);
  }

  buffer += decoder.decode();

  if (buffer.trim()) {
    callback(buffer);
  }
}

/* INTERPRETAR INFORMAÇÕES DO CANAL */
function interpretarExtinf(linha) {
  const virgula = linha.indexOf(',');
  const nome = virgula >= 0
    ? linha.substring(virgula + 1).trim()
    : 'Canal';

  const grupo = linha.match(/group-title="([^"]*)"/i);

  return {
    nome: nome || 'Canal',
    categoria: grupo && grupo[1].trim()
      ? grupo[1].trim()
      : 'Outros'
  };
}

/* CARREGAR CATEGORIAS DOS DOIS ARQUIVOS */
async function carregarCategorias() {
  status.textContent = 'Lendo categorias...';

  const encontrados = new Set();

  try {
    for (const arquivo of arquivos) {
      let info = null;

      await lerLinhas(arquivo, (linhaOriginal) => {
        const linha = linhaOriginal.trim();

        if (linha.startsWith('#EXTINF:')) {
          info = interpretarExtinf(linha);
          return;
        }

        if (
          linha &&
          !linha.startsWith('#') &&
          /^https?:\/\//i.test(linha)
        ) {
          if (info) {
            encontrados.add(info.categoria);
          }

          info = null;
        }
      });
    }

    categorias = [...encontrados].sort();
    categoriasCarregadas = true;

    mostrarCategorias();

    status.textContent =
      `${categorias.length} categoria(s) encontrada(s).`;

  } catch (erro) {
    console.error(erro);
    status.textContent =
      'Erro ao ler as playlists. Verifique os arquivos na pasta www.';
  }
}

/* MOSTRAR CATEGORIAS */
function mostrarCategorias() {
  telaAtual = 'categorias';
  channels.innerHTML = '';

  panelTitle.textContent = 'CATEGORIAS';
  pageTitle.textContent = 'TV AO VIVO';

  categorias.forEach((categoria) => {
    const botao = document.createElement('button');

    botao.className = 'channel';
    botao.textContent = '📂 ' + categoria;

    botao.addEventListener('click', () => {
      categoriaAtual = categoria;
      paginaAtual = 0;
      carregarPagina();
    });

    channels.appendChild(botao);
  });

  const primeiro = channels.querySelector('.channel');
  if (primeiro) primeiro.focus();
}

/* CARREGAR SOMENTE UMA PÁGINA DA CATEGORIA */
async function carregarPagina() {
  telaAtual = 'canais';
  channels.innerHTML = '';

  panelTitle.textContent = categoriaAtual;
  pageTitle.textContent = 'TV AO VIVO';

  status.textContent = 'Carregando canais...';

  const inicio = paginaAtual * TAMANHO_PAGINA;
  const fim = inicio + TAMANHO_PAGINA;

  let quantidade = 0;
  const resultados = [];

  try {
    for (const arquivo of arquivos) {
      let info = null;

      await lerLinhas(arquivo, (linhaOriginal) => {
        const linha = linhaOriginal.trim();

        if (linha.startsWith('#EXTINF:')) {
          info = interpretarExtinf(linha);
          return;
        }

        if (
          linha &&
          !linha.startsWith('#') &&
          /^https?:\/\//i.test(linha)
        ) {
          if (info && info.categoria === categoriaAtual) {
            if (quantidade >= inicio && quantidade < fim) {
              resultados.push({
                nome: info.nome,
                url: linha
              });
            }

            quantidade++;
          }

          info = null;
        }
      });
    }

    /* BOTÃO PARA VOLTAR ÀS CATEGORIAS */
    const voltar = document.createElement('button');
    voltar.className = 'channel';
    voltar.textContent = '← Voltar às categorias';
    voltar.addEventListener('click', mostrarCategorias);
    channels.appendChild(voltar);

    /* MOSTRAR CANAIS DA PÁGINA */
    resultados.forEach((canal) => {
      const botao = document.createElement('button');

      botao.className = 'channel';
      botao.textContent = canal.nome;

      botao.addEventListener('click', () => {
        abrirPlayer(canal.url, canal.nome);
      });

      channels.appendChild(botao);
    });

    /* NAVEGAÇÃO ENTRE PÁGINAS */
    const navegacao = document.createElement('div');
    navegacao.style.display = 'flex';
    navegacao.style.gap = '10px';
    navegacao.style.marginTop = '15px';

    if (paginaAtual > 0) {
      const anterior = document.createElement('button');
      anterior.className = 'channel nav-button';
      anterior.textContent = '← Anterior';

      anterior.addEventListener('click', () => {
        paginaAtual--;
        carregarPagina();
      });

      navegacao.appendChild(anterior);
    }

    if (quantidade > fim) {
      const proxima = document.createElement('button');
      proxima.className = 'channel nav-button';
      proxima.textContent = 'Próxima →';

      proxima.addEventListener('click', () => {
        paginaAtual++;
        carregarPagina();
      });

      navegacao.appendChild(proxima);
    }

    channels.appendChild(navegacao);

    status.textContent =
      `${quantidade} canal(is) nesta categoria. Página ${paginaAtual + 1}.`;

    const primeiroCanal = channels.querySelector('.channel');
    if (primeiroCanal) primeiroCanal.focus();

  } catch (erro) {
    console.error(erro);
    status.textContent = 'Erro ao carregar os canais.';
  }
}

/* ABRIR TV */
async function abrirTV() {
  home.classList.add('hidden');
  tvScreen.style.display = 'block';

  if (!categoriasCarregadas) {
    await carregarCategorias();
  } else {
    mostrarCategorias();
  }
}

/* PLAYER */
function abrirPlayer(url, nome) {
  status.textContent = `Abrindo: ${nome}`;

  playerScreen.style.display = 'block';
  playerMessage.classList.remove('hidden');
  playerMessage.textContent = `Carregando: ${nome}`;

  video.src = url;
  video.load();

  video.play()
    .then(() => {
      playerMessage.classList.add('hidden');
      status.textContent = `Assistindo: ${nome}`;
    })
    .catch((erro) => {
      console.error(erro);
      playerMessage.textContent =
        'Não foi possível reproduzir este canal.';
      status.textContent = 'Erro ao reproduzir o canal.';
    });
}

/* FECHAR PLAYER */
function fecharPlayer() {
  video.pause();
  video.removeAttribute('src');
  video.load();

  playerScreen.style.display = 'none';

  if (telaAtual === 'canais') {
    carregarPagina();
  } else {
    mostrarCategorias();
  }

  status.textContent = 'TV ao vivo.';
}

/* VOLTAR AO INÍCIO */
function voltarInicio() {
  tvScreen.style.display = 'none';
  home.classList.remove('hidden');

  telaAtual = 'inicio';
  pageTitle.textContent = 'INÍCIO';
  status.textContent = 'ABB iniciado.';

  document.getElementById('tv-button').focus();
}

/* FILMES E SÉRIES */
function mostrarMensagem(categoria) {
  status.textContent =
    `${categoria}: catálogo ainda não configurado.`;
}

/* NAVEGAÇÃO PELO CONTROLE REMOTO */
document.addEventListener('keydown', (event) => {
  const teclasVoltar = [
    'Escape',
    'Backspace',
    'BrowserBack',
    'GoBack'
  ];

  if (!teclasVoltar.includes(event.key)) return;

  event.preventDefault();

  if (playerScreen.style.display === 'block') {
    fecharPlayer();
    return;
  }

  if (tvScreen.style.display === 'block') {
    if (telaAtual === 'canais') {
      mostrarCategorias();
    } else {
      voltarInicio();
    }
  }
});

document.getElementById('tv-button')
  .addEventListener('click', abrirTV);

document.getElementById('tv-button').focus();
</script>
