
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB IPTV</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 25px 5%;
  background: #101a2d;
  border-bottom: 2px solid #1478ff;
}

.logo {
  color: #1685ff;
  font-size: 38px;
  font-weight: bold;
}

main { padding: 30px 5%; }

.menu {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin: 25px 0;
}

.item, .channel {
  padding: 18px;
  background: #17243a;
  border: 2px solid transparent;
  border-radius: 10px;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.item:focus, .channel:focus {
  outline: none;
  border-color: #1685ff;
  background: #203b61;
}

#player {
  display: none;
  width: 100%;
  max-width: 900px;
  background: #000;
  margin-top: 20px;
}

video {
  width: 100%;
  max-height: 500px;
  background: #000;
}

#channels {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}

#status {
  margin-top: 25px;
  color: #aabbd3;
}
</style>
</head>

<body>

<header>
  <div class="logo">ABB IPTV</div>
</header>

<main>
  <h1>Bem-vindo ao ABB</h1>
  <p>Escolha uma categoria para começar.</p>

  <div class="menu">
    <button class="item" onclick="abrirTV()">📺 TV ao vivo</button>
    <button class="item" onclick="mensagem('Filmes')">🎬 Filmes</button>
    <button class="item" onclick="mensagem('Séries')">📚 Séries</button>
  </div>

  <section id="tv" style="display:none">
    <h2>TV ao vivo</h2>
    <div id="channels"></div>

    <div id="player">
      <video id="video" controls autoplay></video>
    </div>
  </section>

  <div id="status">
    ABB iniciado.
  </div>
</main>

<script>
async function abrirTV() {
  const tv = document.getElementById('tv');
  const lista = document.getElementById('channels');

  tv.style.display = 'block';
  lista.innerHTML = '';

  document.getElementById('status').textContent =
    'Carregando lista de canais...';

  try {
    const resposta = await fetch('channels.m3u');
    if (!resposta.ok) throw new Error('Lista não encontrada');

    const conteudo = await resposta.text();
    const linhas = conteudo.split(/\r?\n/);

    let nome = '';

    linhas.forEach(linha => {
      linha = linha.trim();

      if (linha.startsWith('#EXTINF:')) {
        nome = linha.split(',').pop().trim();
      } else if (linha && !linha.startsWith('#') &&
                 linha.startsWith('https://')) {
        const botao = document.createElement('button');
        botao.className = 'channel';
        botao.textContent = nome || 'Canal';
        botao.onclick = () => reproduzir(linha);
        lista.appendChild(botao);
        nome = '';
      }
    });

    document.getElementById('status').textContent =
      lista.children.length
        ? 'Selecione um canal.'
        : 'Nenhum canal autorizado configurado.';
  } catch (erro) {
    document.getElementById('status').textContent =
      'Não foi possível carregar channels.m3u.';
  }
}

function reproduzir(url) {
  const player = document.getElementById('player');
  const video = document.getElementById('video');

  player.style.display = 'block';
  video.src = url;
  video.play().catch(() => {
    document.getElementById('status').textContent =
      'Não foi possível iniciar. Verifique o formato e a autorização da transmissão.';
  });
}

function mensagem(categoria) {
  document.getElementById('status').textContent =
    categoria + ': conteúdo ainda não configurado.';
}

document.querySelector('.item').focus();
</script>

</body>
</html>
