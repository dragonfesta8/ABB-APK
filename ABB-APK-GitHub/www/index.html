<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB IPTV</title>

<style>
:root {
  --bg: #0d0b14;
  --panel: #171322;
  --panel-light: #211b30;
  --lilac: #c7a6ff;
  --mint: #8ff0c4;
  --text: #ffffff;
  --muted: #aaa4b8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* CABEÇALHO */
header {
  height: 100px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 2px solid var(--lilac);
}

.logo {
  color: var(--lilac);
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 2px;
}

.page-title {
  color: var(--mint);
  font-size: 18px;
  font-weight: bold;
}

/* TELA INICIAL */
#home {
  padding: 45px 5%;
}

.welcome {
  font-size: 30px;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);
  font-size: 18px;
}

.home-menu {
  display: flex;
  gap: 22px;
  margin-top: 45px;
}

.home-item {
  width: 260px;
  height: 160px;
  padding: 25px;
  background: var(--panel);
  border: 3px solid transparent;
  border-radius: 16px;
  color: white;
  font-size: 22px;
  text-align: left;
  cursor: pointer;
  transition: 0.15s;
}

.home-item span {
  display: block;
  font-size: 38px;
  margin-bottom: 14px;
}

.home-item:focus {
  outline: none;
  border-color: var(--mint);
  background: var(--panel-light);
  transform: scale(1.04);
}

/* TELA DE TV */
#tv-screen {
  display: none;
  height: calc(100vh - 100px);
  padding: 25px 4%;
}

.tv-layout {
  display: grid;
  grid-template-columns: 32% 1fr;
  gap: 25px;
  height: 100%;
}

/* LISTA LATERAL */
.channel-panel {
  background: var(--panel);
  border-radius: 16px;
  padding: 18px;
  overflow-y: auto;
}

.panel-title {
  color: var(--lilac);
  font-size: 18px;
  font-weight: bold;
  padding: 8px 10px 18px;
  border-bottom: 1px solid #393047;
}

#channels {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 14px;
}

.channel {
  width: 100%;
  padding: 16px;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 10px;
  color: white;
  text-align: left;
  font-size: 17px;
  cursor: pointer;
}

.channel:focus {
  outline: none;
  border-color: var(--mint);
  background: #242035;
}

/* ÁREA DE VÍDEO */
.video-panel {
  position: relative;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.video-placeholder {
  color: var(--muted);
  text-align: center;
  font-size: 20px;
  padding: 30px;
}

/* STATUS */
#status {
  position: absolute;
  bottom: 20px;
  right: 30px;
  color: var(--muted);
  font-size: 14px;
}

/* ESCONDER */
.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <div class="logo">ABB IPTV</div>
  <div class="page-title" id="page-title">INÍCIO</div>
</header>

<!-- TELA INICIAL -->
<main id="home">
  <div class="welcome">Bem-vindo ao ABB</div>
  <div class="subtitle">Selecione uma categoria para começar.</div>

  <div class="home-menu">
    <button class="home-item" id="tv-button">
      <span>📺</span>
      TV ao vivo
    </button>

    <button class="home-item" onclick="mostrarMensagem('Filmes')">
      <span>🎬</span>
      Filmes
    </button>

    <button class="home-item" onclick="mostrarMensagem('Séries')">
      <span>📚</span>
      Séries
    </button>
  </div>
</main>

<!-- TELA DE TV -->
<main id="tv-screen">
  <div class="tv-layout">

    <aside class="channel-panel">
      <div class="panel-title">CANAIS</div>
      <div id="channels"></div>
    </aside>

    <section class="video-panel">
      <div class="video-placeholder" id="video-placeholder">
        Selecione um canal e pressione OK para assistir.
      </div>

      <video id="video" class="hidden" controls></video>
    </section>

  </div>
</main>

<div id="status">ABB iniciado.</div>

<script>
const home = document.getElementById('home');
const tvScreen = document.getElementById('tv-screen');
const channels = document.getElementById('channels');
const pageTitle = document.getElementById('page-title');
const status = document.getElementById('status');
const video = document.getElementById('video');
const placeholder = document.getElementById('video-placeholder');

let canaisCarregados = false;

document.getElementById('tv-button').addEventListener('click', abrirTV);

async function abrirTV() {
  home.classList.add('hidden');
  tvScreen.style.display = 'block';
  pageTitle.textContent = 'TV AO VIVO';

  if (!canaisCarregados) {
    await carregarCanais();
  }

  const primeiroCanal = document.querySelector('.channel');
  if (primeiroCanal) primeiroCanal.focus();
}

async function carregarCanais() {
  status.textContent = 'Carregando canais...';

  try {
    const resposta = await fetch('channels.m3u');

    if (!resposta.ok) {
      throw new Error('Lista não encontrada');
    }

    const texto = await resposta.text();
    const linhas = texto.split(/\r?\n/);

    let nome = '';
    let quantidade = 0;

    for (const linhaOriginal of linhas) {
      const linha = linhaOriginal.trim();

      if (linha.startsWith('#EXTINF:')) {
        nome = linha.split(',').pop().trim();
        continue;
      }

      if (
        linha &&
        !linha.startsWith('#') &&
        /^https?:\/\//i.test(linha)
      ) {
        const botao = document.createElement('button');

        botao.className = 'channel';
        botao.textContent = nome || 'Canal';

        const url = linha;

        botao.addEventListener('click', () => {
          reproduzirCanal(url, botao.textContent);
        });

        channels.appendChild(botao);

        nome = '';
        quantidade++;
      }
    }

    canaisCarregados = true;

    status.textContent = quantidade
      ? `${quantidade} canal(is) carregado(s).`
      : 'Nenhum canal configurado.';

  } catch (erro) {
    console.error(erro);
    status.textContent = 'Erro ao carregar a lista de canais.';
  }
}

function reproduzirCanal(url, nome) {
  status.textContent = `Abrindo: ${nome}`;

  placeholder.classList.add('hidden');
  video.classList.remove('hidden');

  video.src = url;
  video.load();

  video.play().then(() => {
    status.textContent = `Assistindo: ${nome}`;
  }).catch((erro) => {
    console.error(erro);
    status.textContent = 'Não foi possível reproduzir este canal.';
    video.classList.add('hidden');
    placeholder.classList.remove('hidden');
  });
}

function mostrarMensagem(categoria) {
  status.textContent =
    `${categoria}: catálogo ainda não configurado.`;
}

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && tvScreen.style.display === 'block') {
    video.pause();
    video.removeAttribute('src');
    video.load();

    tvScreen.style.display = 'none';
    home.classList.remove('hidden');
    pageTitle.textContent = 'INÍCIO';

    document.getElementById('tv-button').focus();
  }
});

document.getElementById('tv-button').focus();
</script>

</body>
</html>
