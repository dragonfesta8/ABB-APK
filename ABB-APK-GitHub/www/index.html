<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB IPTV</title>

<style>
:root {
  --bg: #0d0b14;
  --panel: #171322;
  --panel-light: #211b30;
  --lilac: #c7a6ff;
  --mint: #8ff0c4;
  --text: #ffffff;
  --muted: #aaa4b8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* CABEÇALHO */
header {
  height: 100px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 2px solid var(--lilac);
}

.logo {
  color: var(--lilac);
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 2px;
}

.page-title {
  color: var(--mint);
  font-size: 18px;
  font-weight: bold;
}

/* TELA INICIAL */
#home {
  padding: 45px 5%;
}

.welcome {
  font-size: 30px;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);
  font-size: 18px;
}

.home-menu {
  display: flex;
  gap: 22px;
  margin-top: 45px;
}

.home-item {
  width: 260px;
  height: 160px;
  padding: 25px;
  background: var(--panel);
  border: 3px solid transparent;
  border-radius: 16px;
  color: white;
  font-size: 22px;
  text-align: left;
  cursor: pointer;
}

.home-item span {
  display: block;
  font-size: 38px;
  margin-bottom: 14px;
}

.home-item:focus {
  outline: none;
  border-color: var(--mint);
  background: var(--panel-light);
  transform: scale(1.04);
}

/* LISTA DE CANAIS */
#tv-screen {
  display: none;
  height: calc(100vh - 100px);
  padding: 25px 4%;
}

.tv-layout {
  height: 100%;
}

.channel-panel {
  width: 100%;
  height: 100%;
  background: var(--panel);
  border-radius: 16px;
  padding: 18px;
  overflow-y: auto;
}

.panel-title {
  color: var(--lilac);
  font-size: 20px;
  font-weight: bold;
  padding: 8px 10px 18px;
  border-bottom: 1px solid #393047;
}

#channels {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 14px;
}

.channel {
  width: 100%;
  padding: 18px;
  background: transparent;
  border: 2px solid transparent;
  border-radius: 10px;
  color: white;
  text-align: left;
  font-size: 18px;
  cursor: pointer;
}

.channel:focus {
  outline: none;
  border-color: var(--mint);
  background: #242035;
}

/* PLAYER EM TELA CHEIA */
#player-screen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 10000;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

/* MENSAGEM DO PLAYER */
#player-message {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 20px;
  z-index: 1;
}

#video {
  position: relative;
  z-index: 2;
}

/* STATUS */
#status {
  position: absolute;
  bottom: 20px;
  right: 30px;
  color: var(--muted);
  font-size: 14px;
  z-index: 20;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header id="header">
  <div class="logo">ABB IPTV</div>
  <div class="page-title" id="page-title">INÍCIO</div>
</header>

<!-- TELA INICIAL -->
<main id="home">
  <div class="welcome">Bem-vindo ao ABB</div>
  <div class="subtitle">Selecione uma categoria para começar.</div>

  <div class="home-menu">
    <button class="home-item" id="tv-button">
      <span>📺</span>
      TV ao vivo
    </button>

    <button class="home-item" onclick="mostrarMensagem('Filmes')">
      <span>🎬</span>
      Filmes
    </button>

    <button class="home-item" onclick="mostrarMensagem('Séries')">
      <span>📚</span>
      Séries
    </button>
  </div>
</main>

<!-- TELA DA LISTA -->
<main id="tv-screen">
  <div class="tv-layout">
    <aside class="channel-panel">
      <div class="panel-title">CANAIS</div>
      <div id="channels"></div>
    </aside>
  </div>
</main>

<!-- PLAYER EM TELA CHEIA -->
<div id="player-screen">
  <div id="player-message">Carregando canal...</div>
  <video id="video" controls autoplay></video>
</div>

<div id="status">ABB iniciado.</div>

<script>
const home = document.getElementById('home');
const tvScreen = document.getElementById('tv-screen');
const playerScreen = document.getElementById('player-screen');
const channels = document.getElementById('channels');
const pageTitle = document.getElementById('page-title');
const status = document.getElementById('status');
const video = document.getElementById('video');
const playerMessage = document.getElementById('player-message');

let canaisCarregados = false;

document.getElementById('tv-button').addEventListener('click', abrirTV);

/* ABRIR LISTA DE CANAIS */
async function abrirTV() {
  home.classList.add('hidden');
  tvScreen.style.display = 'block';
  pageTitle.textContent = 'TV AO VIVO';

  if (!canaisCarregados) {
    await carregarCanais();
  }

  const primeiroCanal = document.querySelector('.channel');
  if (primeiroCanal) {
    primeiroCanal.focus();
  }
}

/* CARREGAR LISTA M3U */
async function carregarCanais() {
  status.textContent = 'Carregando canais...';

  try {
    const resposta = await fetch('channels.m3u');

    if (!resposta.ok) {
      throw new Error('Lista não encontrada');
    }

    const texto = await resposta.text();
    const linhas = texto.split(/\r?\n/);

    let nome = '';
    let quantidade = 0;

    for (const linhaOriginal of linhas) {
      const linha = linhaOriginal.trim();

      if (linha.startsWith('#EXTINF:')) {
        nome = linha.split(',').pop().trim();
        continue;
      }

      if (
        linha &&
        !linha.startsWith('#') &&
        /^https?:\/\//i.test(linha)
      ) {
        const botao = document.createElement('button');

        botao.className = 'channel';
        botao.textContent = nome || 'Canal';

        const url = linha;

        botao.addEventListener('click', () => {
          abrirPlayer(url, botao.textContent);
        });

        channels.appendChild(botao);

        nome = '';
        quantidade++;
      }
    }

    canaisCarregados = true;

    status.textContent = quantidade
      ? `${quantidade} canal(is) carregado(s).`
      : 'Nenhum canal configurado.';

  } catch (erro) {
    console.error(erro);
    status.textContent = 'Erro ao carregar a lista de canais.';
  }
}

/* ABRIR VÍDEO EM TELA CHEIA */
function abrirPlayer(url, nome) {
  status.textContent = `Abrindo: ${nome}`;

  playerScreen.style.display = 'block';
  playerMessage.classList.remove('hidden');
  playerMessage.textContent = `Carregando: ${nome}`;

  video.src = url;
  video.load();

  video.play()
    .then(() => {
      playerMessage.classList.add('hidden');
      status.textContent = `Assistindo: ${nome}`;
    })
    .catch((erro) => {
      console.error(erro);
      playerMessage.textContent =
        'Não foi possível reproduzir este canal.';
      status.textContent = 'Erro ao reproduzir o canal.';
    });
}

/* FECHAR PLAYER E VOLTAR PARA A LISTA */
function fecharPlayer() {
  video.pause();
  video.removeAttribute('src');
  video.load();

  playerScreen.style.display = 'none';

  const primeiroCanal = document.querySelector('.channel');
  if (primeiroCanal) {
    primeiroCanal.focus();
  }

  status.textContent = 'Lista de canais.';
}

/* VOLTAR PARA A TELA INICIAL */
function voltarInicio() {
  tvScreen.style.display = 'none';
  home.classList.remove('hidden');

  pageTitle.textContent = 'INÍCIO';
  status.textContent = 'ABB iniciado.';

  document.getElementById('tv-button').focus();
}

/* FILMES E SÉRIES */
function mostrarMensagem(categoria) {
  status.textContent =
    `${categoria}: catálogo ainda não configurado.`;
}

/* BOTÃO VOLTAR */
document.addEventListener('keydown', (event) => {
  const teclasVoltar = [
    'Escape',
    'Backspace',
    'BrowserBack',
    'GoBack'
  ];

  if (!teclasVoltar.includes(event.key)) {
    return;
  }

  event.preventDefault();

  /* Se o vídeo está aberto: volta para a lista */
  if (playerScreen.style.display === 'block') {
    fecharPlayer();
    return;
  }

  /* Se a lista está aberta: volta para o início */
  if (tvScreen.style.display === 'block') {
    voltarInicio();
  }
});

document.getElementById('tv-button').focus();
</script>

</body>
</html>
