<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB IPTV</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 30px 5%;
  background: #101a2d;
  border-bottom: 2px solid #1478ff;
}

.logo {
  color: #1685ff;
  font-size: 38px;
  font-weight: bold;
}

main {
  padding: 45px 5%;
}

h1 { font-size: 30px; }

.menu {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  margin-top: 35px;
}

.item {
  width: 240px;
  min-height: 145px;
  padding: 25px;
  background: #17243a;
  border: 3px solid transparent;
  border-radius: 12px;
  color: white;
  font-size: 22px;
  text-align: left;
  cursor: pointer;
}

.item:focus {
  outline: none;
  border-color: #1685ff;
  background: #203b61;
  transform: scale(1.04);
}

.item span {
  display: block;
  font-size: 38px;
  margin-bottom: 15px;
}

#status {
  margin-top: 35px;
  color: #aabbd3;
  font-size: 17px;
}
</style>
</head>

<body>

<header>
  <div class="logo">ABB IPTV</div>
</header>

<main>
  <h1>Bem-vindo ao ABB</h1>
  <p>Escolha uma categoria para começar.</p>

  <div class="menu">
    <button class="item" onclick="abrir('TV ao vivo')">
      <span>📺</span>
      TV ao vivo
    </button>

    <button class="item" onclick="abrir('Filmes')">
      <span>🎬</span>
      Filmes
    </button>

    <button class="item" onclick="abrir('Séries')">
      <span>📚</span>
      Séries
    </button>
  </div>

  <div id="status">
    ABB iniciado. Aguardando configuração de conteúdo.
  </div>
</main>

<script>
function abrir(categoria) {
  document.getElementById('status').textContent =
    categoria + ': conteúdo ainda não configurado.';
}

document.querySelector('.item').focus();
</script>

</body>
</html>
