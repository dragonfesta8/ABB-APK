<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>ABB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 90px);
      margin: 0 0 20px;
      letter-spacing: 4px;
    }

    p {
      font-size: clamp(18px, 2vw, 30px);
      color: #cccccc;
      margin: 0;
    }

    .loader {
      width: 55px;
      height: 55px;
      margin: 35px auto 0;
      border: 6px solid #444;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>ABB</h1>

    <p>Conectando ao serviço...</p>

    <div
      class="loader"
      aria-label="Carregando"
    ></div>
  </main>

</body>
</html>
