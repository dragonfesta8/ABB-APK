name: Gerar APK ABB Android TV

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ABB

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: bun install

      - name: Configurar ABB local
        run: bun scripts/configure.mjs

      - name: Criar projeto Android
        run: bunx cap add android

      - name: Sincronizar Android
        run: bunx cap sync android

      - name: Configurar Android TV
        run: bun scripts/android-tv.mjs

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ABB-AndroidTV-APK
          path: ABB/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
